<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meta — Code stats</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <main>
    <h1>Code statistics</h1>

    <div id="scrolly-1">
      <div id="scatter-story">
        <p>Scroll to walk through commit activity over time.</p>
    </div>

    <div id="scatter-plot">
    <div id="stats"></div>
    <div id="chart"></div>
    </div>
  
</div>

<div class="commit-filter">
      <label for="commit-progress">Show commits until:</label>
      <input id="commit-progress" type="range" min="0" max="100" value="100" />
      <time id="commit-time" datetime=""></time>
    </div>

<dl id="commit-tooltip" class="info tooltip" hidden> … </dl>
<p id="selection-count">No commits selected</p>
<h2>Languages in selection</h2>
<dl id="language-breakdown" class="stats"></dl>

<section id="files-section">
  <h2>Files</h2>
  <dl id="files"></dl>
</section>



    <script type="module" src="./main.js"></script>
  </main>

  <script type="module" src="../global.js"></script>
</body>
</html>
